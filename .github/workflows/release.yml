name: Publish community preview
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run pack
      - name: Publish verified preview assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = context.ref.replace('refs/tags/', '');
            if (tag !== 'v' + manifest.version) throw new Error('Tag and package version differ');
            const packageName = manifest.name + '-' + manifest.version + '.tgz';
            const sourceName = manifest.name + '-source-' + tag + '.zip';
            await exec.exec('git', ['archive', '--format=zip', '--prefix=dsh-global-prompt/',
              '--output=' + path.join('dist', sourceName), 'HEAD']);
            const files = [
              { name: packageName, type: 'application/gzip' },
              { name: sourceName, type: 'application/zip' },
            ];
            const checksums = files.map(file => {
              const data = fs.readFileSync(path.join('dist', file.name));
              return crypto.createHash('sha256').update(data).digest('hex') + '  ' + file.name;
            }).join('\n') + '\n';
            fs.writeFileSync('dist/SHA256SUMS.txt', checksums);
            files.push({ name: 'SHA256SUMS.txt', type: 'text/plain' });
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...repository, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...repository, tag_name: tag, target_commitish: context.sha,
                name: tag + ' 社区预览版', body: fs.readFileSync('RELEASE.md', 'utf8'),
                draft: true, prerelease: true,
              })).data;
            }
            for (const file of files) {
              const data = fs.readFileSync(path.join('dist', file.name));
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              const existing = release.assets.find(asset => asset.name === file.name);
              if (existing) {
                if (existing.digest !== digest) throw new Error('Existing asset differs: ' + file.name);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                ...repository, release_id: release.id, name: file.name,
                headers: { 'content-type': file.type, 'content-length': data.length },
                data,
              });
            }
            const published = await github.rest.repos.updateRelease({
              ...repository, release_id: release.id, draft: false, prerelease: true,
            });
            core.notice('Published ' + published.data.html_url);
